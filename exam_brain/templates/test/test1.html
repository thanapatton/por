  const word3 = [

    ["บ", "จ", "ช"],

  const word4 = [

    ["ก", "ม", "ง", "พ"],

  ];
  const word5 = [

  ];
  const word6 = [

  const word7 = [

    ["ล", "พ", "ม", "บ", "ง", "น", "ย"],
    ["ล", "ช", "ท", "ค", "ก", "น", "บ"],
  ];

  const anser3 = [
    ["12", "7", "5"],
    ["19", "9", "7"],

  ];
  const anser4 = [
    ["9", "10", "15", "13"],

  ];
  const anser5 = [
    ["14", "6", "1", "1", "5"],
    ["10", "7", "18", "6", "1"],
    ["4", "15", "14", "5", "10"],
  ];
  const anser6 = [
    ["29", "10", "11", "9", "23", "17"],
    ["11", "7", "13", "4", "11", "8"],
    ["8", "4", "3", "19", "5", "21"],
  ];
  const anser7 = [
    ["5", "19", "7", "14", "14", "20", "5"],
    ["11", "14", "28", "27", "5", "23", "7"],
    ["1", "8", "7", "29", "14", "31", "4"],
  ];

  var ansList3 = new Array(3).fill(null).map(() => new Array(3).fill(false));
  var ansList4 = new Array(4).fill(null).map(() => new Array(4).fill(false));
  var ansList5 = new Array(5).fill(null).map(() => new Array(5).fill(false));
  var ansList6 = new Array(6).fill(null).map(() => new Array(6).fill(false));
  var ansList7 = new Array(7).fill(null).map(() => new Array(7).fill(false));

  var time3 = new Array(3).fill(0).map(() => new Array(3).fill(0));
  var time4 = new Array(4).fill(0).map(() => new Array(4).fill(0));
  var time5 = new Array(5).fill(0).map(() => new Array(5).fill(0));
  var time6 = new Array(6).fill(0).map(() => new Array(6).fill(0));
  var time7 = new Array(7).fill(0).map(() => new Array(7).fill(0));

  var problems = [problems_3, problems_4, problems_5, problems_6];

  var cancelToken = {};

  var round = 0;
  $(document).ready(function () {
    var clickCount = 0;
    $(".btn.btn-primary.ask").click(function () {
      var buttonText = $(this).text();
      $("#ansWord").text($("#ansWord").text() + " " + buttonText);
      clickCount++;
      if (clickCount === problems_4[round].length) {
        round = round + 1;
        if (round <= (problems_4.length-1)) {
          setProblems(problems_4, round, anser4, ansList4, word4, cancelToken);
          clickCount = 0;
        } else {
          console.log(time3);
          console.log(ansList3);
        }
      }
    });
  });

  async function test1() {
    $("#start").hide();
    $("#solution1").html("เตรียมพร้อม");
    await delay(500);
    setProblems(problems_4, round, anser4, ansList4, word4, cancelToken);
    $("#next")
      .off("click")
      .on("click", function () {
        if (cancelToken.cancel) cancelToken.cancel();
      });
  }

  async function setProblems(problems, i, anser, ansList, word, cancelToken) {
    $("#askWord").hide();
    $("#ansWord").hide();
    $("#ansWord").text("");
    $("#solution1").show();
    for (let j = 0; j <= problems[i].length; j++) {
      $("#true")
        .off("click")
        .on("click", function () {
          ansList[i][j] = true;
          if (cancelToken.cancel) cancelToken.cancel();
        });
      $("#false")
        .off("click")
        .on("click", function () {
          ansList[i][j] = false;
          if (cancelToken.cancel) cancelToken.cancel();
        });
      $("#next").show();
      $("#true").hide();
      $("#false").hide();
      $("#solution1").html(problems[i][j]);
      console.log(word[i])
      await cancellableDelay(5000, cancelToken);
      $("#solution1").html(anser[i][j]);
      $("#next").hide();
      $("#true").show();
      $("#false").show();
      await cancellableDelayWithStore(4000, cancelToken, time3[i][j]);
      if (j < word[i].length - 1) {
        $("#solution1").html(word[i][j]);
        $("#true").hide();
        $("#false").hide();
        await delay(500);
      } else {
        $("#askWord").show();
        $("#ansWord").show();
        $("#true").hide();
        $("#false").hide();
        $("#solution1").hide();
      }
    }
  }

  function setAsnWord() {
    $("#ansWord").html();
  }

  function delay(time) {
    return new Promise((resolve) => setTimeout(resolve, time));
  }

  function cancellableDelay(ms, cancelToken) {
    return Promise.race([
      new Promise((resolve) => setTimeout(resolve, ms)),
      new Promise((resolve) => (cancelToken.cancel = resolve)),
    ]);
  }

  function cancellableDelayWithStore(ms, cancelToken, elapsedTimesArray) {
    let startTime = Date.now(); // Capture the start time
    return Promise.race([
      new Promise((resolve) =>
        setTimeout(() => {
          let endTime = Date.now();
          let elapsedTime = endTime - startTime;
          elapsedTimesArray = elapsedTime;
          resolve();
        }, ms)
      ),
      new Promise((resolve) => {
        cancelToken.cancel = () => {
          let cancelTime = Date.now();
          let elapsedTime = cancelTime - startTime;
          elapsedTimesArray = elapsedTime;
          resolve();
        };
      }),
    ]);
  }

  function getRandomIndex(arr) {
    return Math.floor(Math.random() * arr.length);
  }
</script>
